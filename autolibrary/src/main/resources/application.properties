spring.application.name=autolibrary
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:school_library}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:A#1rnold233}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# SQL logging is off by default — see logging block below for how to
# turn it back on temporarily while debugging a specific query.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


server.port=${PORT:8080}

jwt.secret=aschoolautoarnoldanglibraSysForStudNyangoriBunyore23341
jwt.expiration=86400000

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
# Turn off SQL noise — enable only when debugging a specific query issue.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Application logging
# com.arnold.autolibrary's level is profile-driven (dev=DEBUG, prod/default=INFO)
# — see logback-spring.xml, not set here so profiles can actually control it.
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Console pattern — readable, includes the correlation id from MDC
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{28} - %msg%n

